<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Coin Top Face Gradient -->
    <linearGradient id="coinFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="50%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    
    <!-- Coin Side Gradient -->
    <linearGradient id="coinEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#064E3B"/>
    </linearGradient>

    <!-- Main Swoosh Arrow Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="25%" style="stop-color:#2563EB"/>
      <stop offset="60%" style="stop-color:#C084FC"/>
      <stop offset="85%" style="stop-color:#E879F9"/>
      <stop offset="100%" style="stop-color:#38BDF8"/>
    </linearGradient>

    <!-- Arrow Head Gradient -->
    <linearGradient id="arrowHeadGrad" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A855F7"/>
      <stop offset="50%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#38BDF8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- BOTTOM COIN -->
    <path d="M 120 280 C 120 260 270 260 270 280 L 270 310 C 270 330 120 330 120 310 Z" fill="url(#coinEdge)"/>
    <ellipse cx="195" cy="280" rx="75" ry="25" fill="url(#coinFace)"/>

    <!-- MIDDLE COIN -->
    <path d="M 120 240 C 120 220 270 220 270 240 L 270 270 C 270 290 120 290 120 270 Z" fill="url(#coinEdge)"/>
    <ellipse cx="195" cy="240" rx="75" ry="25" fill="url(#coinFace)"/>

    <!-- TOP COIN -->
    <path d="M 120 200 C 120 180 270 180 270 200 L 270 230 C 270 250 120 250 120 230 Z" fill="url(#coinEdge)"/>
    <ellipse cx="195" cy="200" rx="75" ry="25" fill="url(#coinFace)"/>

    <!-- Concentric Grooves on Top Coin -->
    <ellipse cx="195" cy="200" rx="55" ry="17" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6"/>
    <ellipse cx="195" cy="200" rx="35" ry="11" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
    <ellipse cx="195" cy="200" rx="18" ry="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>

    <!-- SECONDARY SMALL SWOOSH AT BOTTOM -->
    <path d="M 230 380 Q 280 375 320 345 Q 275 365 230 380 Z" fill="#C084FC" opacity="0.9"/>

    <!-- MAIN SWEEPING ARROW BODY -->
    <path d="M 115 305 
             C 110 390 220 420 330 350 
             C 380 320 410 240 410 180 
             L 370 215 
             C 365 260 335 305 295 330 
             C 220 380 145 350 140 295 
             Z" 
          fill="url(#swooshGrad)"/>

    <!-- ARROW HEAD -->
    <path d="M 330 195 
             L 425 110 
             L 435 240 
             L 395 210 
             C 385 245 360 280 325 305 
             L 330 195 Z" 
          fill="url(#arrowHeadGrad)"/>
          
    <!-- HIGHLIGHT SWOOSH OVERLAP ON ARROW -->
    <path d="M 120 320 C 130 380 230 410 330 345 C 230 390 140 360 120 320 Z" fill="#38BDF8" opacity="0.6"/>
  </g>
</svg>
