<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Ring Arcs Gradients -->
    <!-- Top Magenta Arc -->
    <linearGradient id="topArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF007A"/>
      <stop offset="60%" style="stop-color:#D946EF"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    
    <!-- Left Orange Arc -->
    <linearGradient id="leftArcGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#D946EF"/>
      <stop offset="40%" style="stop-color:#FF4500"/>
      <stop offset="100%" style="stop-color:#FFB700"/>
    </linearGradient>

    <!-- Bottom Blue Arc -->
    <linearGradient id="bottomArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D946EF"/>
      <stop offset="50%" style="stop-color:#0055FF"/>
      <stop offset="100%" style="stop-color:#00C8FF"/>
    </linearGradient>

    <!-- Center Coin Gradients -->
    <linearGradient id="topCoinFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF8800"/>
    </linearGradient>
    <linearGradient id="topCoinSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8800"/>
      <stop offset="100%" style="stop-color:#FF3300"/>
    </linearGradient>

    <linearGradient id="midCoinSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3300"/>
      <stop offset="100%" style="stop-color:#D91B5C"/>
    </linearGradient>

    <linearGradient id="botCoinSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D91B5C"/>
      <stop offset="100%" style="stop-color:#7E22CE"/>
    </linearGradient>

    <!-- Front Blue Zigzag Arrow Gradient -->
    <linearGradient id="arrowBodyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BFFF"/>
      <stop offset="50%" style="stop-color:#0066FF"/>
      <stop offset="100%" style="stop-color:#0040DD"/>
    </linearGradient>

    <linearGradient id="arrowEdgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- 1. LEFT ORANGE SWOOSH ARC -->
    <path d="M 120 390 
             C 40 300 50 170 180 120 
             C 120 160 100 250 155 330 
             C 170 350 200 380 230 400 
             C 180 415 140 405 120 390 Z" 
          fill="url(#leftArcGrad)"/>

    <!-- 2. TOP PINK/MAGENTA SWOOSH ARC -->
    <path d="M 105 198 
             C 140 60 300 30 400 140 
             C 320 65 190 80 145 155 
             C 130 180 120 205 118 225 
             Z" 
          fill="url(#topArcGrad)"/>

    <!-- 3. BOTTOM BLUE SWOOSH ARC -->
    <path d="M 125 405 
             C 220 495 390 485 450 370 
             C 410 440 280 470 190 410 
             C 165 395 145 380 125 405 Z" 
          fill="url(#bottomArcGrad)"/>

    <!-- 4. CENTER COIN STACK -->
    <!-- Bottom Coin Side -->
    <path d="M 160 270 C 160 240 350 240 350 270 L 350 330 C 350 360 160 360 160 330 Z" fill="url(#botCoinSide)"/>
    <ellipse cx="255" cy="270" rx="95" ry="30" fill="#E11D48"/>

    <!-- Middle Coin Side -->
    <path d="M 165 215 C 165 185 345 185 345 215 L 345 270 C 345 300 165 300 165 270 Z" fill="url(#midCoinSide)"/>
    <ellipse cx="255" cy="215" rx="90" ry="28" fill="#FF4500"/>

    <!-- Top Coin Side -->
    <path d="M 170 155 C 170 125 340 125 340 155 L 340 210 C 340 240 170 240 170 210 Z" fill="url(#topCoinSide)"/>
    
    <!-- Top Coin Face -->
    <ellipse cx="255" cy="155" rx="85" ry="27" fill="url(#topCoinFace)"/>
    <ellipse cx="255" cy="155" rx="80" ry="24" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>

    <!-- Rupee Symbol ₹ on Top Coin -->
    <text x="255" y="175" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle">₹</text>

    <!-- 5. FRONT ZIGZAG BLUE ARROW -->
    <!-- 3D Base/Edge of Arrow -->
    <path d="M 125 410 
             L 280 270 
             L 325 315 
             L 460 165 
             L 480 280 
             L 430 250 
             L 325 365 
             L 280 320 
             L 155 435 
             Z" 
          fill="url(#arrowEdgeGrad)"/>

    <!-- Main Front Face of Arrow -->
    <path d="M 120 400 
             L 280 260 
             L 325 305 
             L 475 135 
             L 455 270 
             L 420 240 
             L 325 345 
             L 280 300 
             L 145 420 
             Z" 
          fill="url(#arrowBodyGrad)"/>

    <!-- White Inner Bevel/Border of Arrow -->
    <path d="M 120 400 
             L 280 260 
             L 325 305 
             L 475 135 
             L 455 270 
             L 420 240 
             L 325 345 
             L 280 300 
             L 145 420 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>
